syntax = "proto3";

package com.labeq.script.rpc.proto.device;

service DeviceService {
  rpc GetDevice(GetDeviceRequest) returns (GetDeviceResponse);
  rpc LookupDevice(DeviceLookupRequest) returns (DeviceLookupResponse);
  rpc GetDeviceMetadata(DeviceMetadataRequest) returns (DeviceMetadataResponse);
}

// Device lookup
message DeviceLookupRequest {
  string  query = 1;
  bool    unique = 2;
}

message DeviceLookupResponse {
  repeated string uuid = 1;
}
// ---

// Get device
message GetDeviceRequest {
  string identifier = 1;
}

message GetDeviceResponse {
  string uuid = 1;
}

// Device data
message DeviceMetadataRequest {
  string  uuid = 1;
}

message DeviceMetadataResponse {
  string  uuid = 1;
  string  name = 2;
  string  model = 3;
  string  manufacturer = 4;
  string  driver = 5;
  string  tags = 6;
}
// ---