syntax = "proto3";

enum WorkerStatus {
  STARTING = 0;
  INITIALIZING = 1;
  PROCESSING = 2;
  AWAITING_DATA = 3;
  STALLED = 4;
  CRASHED = 5;
  UNKNOWN = 9;
}

service HeartbeatService {
  rpc Beat(HeartbeatRequest) returns (HeartbeatResponse);
}

message HeartbeatRequest {
  uint32 id = 1;
  WorkerStatus status = 2;
}

message HeartbeatResponse {
  uint32 id = 1;
}
